<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>B1的單字練習網頁</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <section class="screen active" id="homeScreen">
      <div class="safe home-safe">
        <div class="home-card">
          <div class="home-badge">B1</div>
          <h1>B1的單字練習網頁</h1>
          <div class="quote-card">
            <p class="quote-zh" id="quoteZh"></p>
            <p class="quote-vi" id="quoteVi"></p>
          </div>
          <div class="select-wrap home-select-wrap">
            <select id="unitSelect" aria-label="選擇單元"></select>
          </div>
          <button class="primary-btn hero-btn" id="startBtn">開始</button>
        </div>
      </div>
    </section>

    <section class="screen" id="menuScreen">
      <div class="safe menu-safe">
        <header class="topbar floating-bar">
          <button class="icon-btn" data-action="home">⌂</button>
          <div class="topbar-title" id="menuUnitTitle">單元 1</div>
          <button class="icon-btn" data-action="settings">⚙</button>
        </header>
        <div class="menu-panel">
          <div class="menu-grid">
            <button class="menu-btn" data-mode="wordlist">單字表</button>
            <button class="menu-btn" data-mode="flash">翻卡</button>
            <button class="menu-btn" data-mode="quiz">選擇測驗</button>
            <button class="menu-btn" data-mode="match">配對</button>
          </div>
        </div>
      </div>
    </section>

    <section class="screen" id="wordlistScreen">
      <div class="safe">
        <header class="topbar floating-bar">
          <button class="icon-btn" data-action="back">←</button>
          <div class="topbar-title" id="wordlistTitle">單字表</div>
          <button class="icon-btn" data-action="settings">⚙</button>
        </header>
        <div class="wordlist-scroll" id="wordlistContainer"></div>
      </div>
    </section>

    <section class="screen" id="flashScreen">
      <div class="safe">
        <header class="topbar floating-bar">
          <button class="icon-btn" data-action="back">←</button>
          <div class="topbar-title">翻卡</div>
          <button class="icon-btn" data-action="settings">⚙</button>
        </header>
        <div class="segment floating-segment">
          <button class="segment-btn active" data-flash-view="grid">多張</button>
          <button class="segment-btn" data-flash-view="single">單張</button>
        </div>
        <div class="flash-toolbar" id="flashGridToolbar">
          <button class="small-btn" data-grid-size="8">8</button>
          <button class="small-btn active" data-grid-size="12">12</button>
          <button class="small-btn" data-grid-size="16">16</button>
          <button class="small-btn fill-btn" id="shuffleFlashBtn">換一組</button>
        </div>
        <div class="flash-grid-wrap active" id="flashGridWrap">
          <div class="flash-grid" id="flashGrid"></div>
        </div>
        <div class="flash-single-wrap" id="flashSingleWrap">
          <div class="single-stage">
            <div class="flash-single-card" id="flashSingleCard"></div>
          </div>
          <div class="single-actions">
            <button class="swipe-btn bad" id="swipeLeftBtn">再練習</button>
            <button class="swipe-btn good" id="swipeRightBtn">我會了</button>
          </div>
        </div>
      </div>
    </section>

    <section class="screen game-screen" id="quizScreen">
      <div class="safe game-safe">
        <header class="topbar floating-bar dark-bar">
          <button class="icon-btn dark-btn" data-action="backToMenu">←</button>
          <div class="topbar-title">選擇測驗</div>
          <button class="icon-btn dark-btn" data-action="settings">⚙</button>
        </header>
        <div class="timer-box game-box">
          <div class="timer-meta">
            <span id="quizTimerText">1:30</span>
            <span id="quizProgressText">0 題</span>
          </div>
          <div class="timer-track"><div class="timer-fill" id="quizTimerFill"></div></div>
        </div>
        <div class="quiz-card game-card">
          <div class="quiz-prompt" id="quizPrompt"></div>
          <div class="quiz-pinyin" id="quizPromptPinyin"></div>
          <div class="quiz-options" id="quizOptions"></div>
          <div class="quiz-feedback" id="quizFeedback"></div>
        </div>
        <div class="result-sheet hidden" id="quizResultSheet">
          <div class="result-icon" id="quizResultIcon">✓</div>
          <h2>完成了</h2>
          <p id="quizResultText"></p>
          <div class="result-actions">
            <button class="primary-btn" id="quizRestartBtn">重新開始</button>
            <button class="secondary-btn" id="quizWrongBtn">看打錯的題目</button>
            <button class="secondary-btn" id="quizMenuBtn">玩其他遊戲</button>
          </div>
        </div>
      </div>
    </section>

    <section class="screen game-screen" id="matchScreen">
      <div class="safe game-safe">
        <header class="topbar floating-bar dark-bar">
          <button class="icon-btn dark-btn" data-action="backToMenu">←</button>
          <div class="topbar-title">配對</div>
          <button class="icon-btn dark-btn" data-action="settings">⚙</button>
        </header>
        <div class="timer-box game-box">
          <div class="timer-meta">
            <span id="matchTimerText">0:40</span>
            <span id="matchProgressText">0 / 9</span>
          </div>
          <div class="timer-track urgent"><div class="timer-fill" id="matchTimerFill"></div></div>
        </div>
        <div class="match-board" id="matchBoard"></div>
        <div class="countdown-overlay hidden" id="matchCountdown"></div>
        <div class="result-sheet hidden" id="matchResultSheet">
          <div class="result-icon" id="matchResultIcon">✓</div>
          <h2 id="matchResultTitle">完成</h2>
          <p id="matchResultText"></p>
          <div class="result-actions">
            <button class="primary-btn" id="matchRestartBtn">重新分牌</button>
            <button class="secondary-btn" id="matchMenuBtn">玩其他遊戲</button>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div class="settings-sheet hidden" id="settingsSheet">
    <div class="sheet-backdrop" id="settingsBackdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div>設定</div>
        <button class="icon-btn" id="closeSettingsBtn">✕</button>
      </div>
      <div class="setting-row">
        <div class="setting-label">顯示拼音</div>
        <label class="switch"><input type="checkbox" id="pinyinToggle"><span class="slider"></span></label>
      </div>
      <div class="setting-row">
        <div class="setting-label">中文 ⇄ 越文</div>
        <label class="switch"><input type="checkbox" id="directionToggle"><span class="slider"></span></label>
      </div>
      <div class="setting-help" id="directionHelp">目前：中文 → 越文</div>
      <div class="setting-actions">
        <button class="secondary-btn" id="goHomeBtn">⌂</button>
        <button class="secondary-btn" id="goBackBtn">←</button>
        <button class="secondary-btn" id="restartBtn">↻</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
